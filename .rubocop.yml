plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-minitest

# Ruby (https://github.com/rubocop-hq/ruby-style-guide)
# Rails (https://github.com/rubocop-hq/rails-style-guide)

AllCops:
  NewCops: enable

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

# Discussão aqui: https://github.com/rubocop/rubocop/issues/8506
Lint/MissingSuper:
  Enabled: false

# Essa inspeção sugere mudar uma iteração com o .each para .find_each indevidamente
# em casos onde a consulta possui uma ordenação de resultados (o .find_each sempre
# ordena pelo id. Além disso, uma consulta que sabidamente trará poucos resultados,
# usar o .each para iteração é muito mais prático e eficiente do que o .find_each.
Rails/FindEach:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false
