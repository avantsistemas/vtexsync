require:
  - rubocop-rails
  - rubocop-rspec
  - rubocop-performance

# Ruby (https://github.com/rubocop-hq/ruby-style-guide)
# Rails (https://github.com/rubocop-hq/rails-style-guide)
# RSpec (https://github.com/rubocop-hq/rspec-style-guide)

AllCops:
  NewCops: enable

Style/Documentation:
  Enabled: false

# Discussão aqui: https://github.com/rubocop/rubocop/issues/8506
Lint/MissingSuper:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Style/FrozenStringLiteralComment:
  Exclude:
    - db/migrate/*.rb

Metrics/BlockLength:
  AllowedMethods:
    - namespace
    - context
    - describe
    - task
  Exclude:
    - /**/*.rake
    - config/**/*.rb

RSpec/ImplicitExpect:
  EnforcedStyle: should

RSpec/ExampleLength:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false
