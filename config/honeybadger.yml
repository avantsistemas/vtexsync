---
api_key: <%= Rails.application.credentials.dig(:honeybadger, :api_key) %>
exceptions:
  # Configura o Honeybadger para não ignorar os erros ignorados por padrão.
  # https://docs.honeybadger.io/lib/ruby/getting-started/ignoring-errors.html
  ignore_only:
    - 'ActionController::RoutingError'
insights:
  enabled: false
